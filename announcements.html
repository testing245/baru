<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman - Sistem Sekolah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            width: 100%;
            background: #f8f9fa;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 30px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: between;
            max-width: 500px;
            margin: 0 auto;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 15px;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-2px);
        }

        .back-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .header-title {
            flex: 1;
        }

        .header-title h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .header-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .filter-section {
            background: white;
            margin: 20px 30px;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-tab {
            background: #f5f5f5;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
            color: #666;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
        }

        .filter-tab:hover {
            transform: translateY(-2px);
        }

        .announcements-container {
            padding: 0 30px;
            max-width: 500px;
            margin: 0 auto;
        }

        .announcement-card {
            background: white;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .announcement-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .announcement-header {
            padding: 20px;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
        }

        .announcement-priority {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-high {
            background: #ffebee;
            color: #d32f2f;
        }

        .priority-normal {
            background: #e3f2fd;
            color: #1976d2;
        }

        .priority-info {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .announcement-category {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #f5f5f5;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #666;
            margin-bottom: 12px;
        }

        .category-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .announcement-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .announcement-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
            color: #666;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .meta-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .announcement-content {
            padding: 20px;
        }

        .announcement-summary {
            font-size: 14px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 15px;
        }

        .announcement-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .read-more {
            color: #667eea;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .read-more:hover {
            color: #5a67d8;
            gap: 8px;
        }

        .read-more-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .new-badge {
            position: absolute;
            top: -5px;
            right: 20px;
            background: #ff9800;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: bold;
            transform: rotate(15deg);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #666;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: #f5f5f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .empty-icon svg {
            width: 40px;
            height: 40px;
            fill: #999;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            padding: 15px 0 25px;
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1);
        }

        .nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #666;
        }

        .nav-item.active {
            color: #ff9800;
        }

        .nav-item:hover {
            opacity: 0.7;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .nav-label {
            font-size: 12px;
            font-weight: 500;
        }

        .search-box {
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px 16px;
            width: 100%;
            font-size: 14px;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .loading-card {
            background: white;
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 20px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        .skeleton-title {
            height: 20px;
            width: 80%;
            margin-bottom: 10px;
        }

        .skeleton-text {
            height: 14px;
            width: 100%;
            margin-bottom: 8px;
        }

        .skeleton-text:last-child {
            width: 60%;
        }

        @keyframes loading {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        .notification-dot {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 12px;
            height: 12px;
            background: #ff4444;
            border-radius: 50%;
            border: 2px solid white;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header {
                padding: 15px 20px;
            }

            .filter-section,
            .announcements-container {
                margin: 15px 20px;
                padding: 15px;
            }

            .announcement-title {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <button class="back-button" onclick="goBack()">
                    <svg class="back-icon" viewBox="0 0 24 24">
                        <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
                    </svg>
                </button>
                <div class="header-title">
                    <h1>Pengumuman</h1>
                    <div class="header-subtitle" id="announcementCount">Memuat pengumuman...</div>
                </div>
            </div>
        </div>

        <div class="filter-section">
            <input type="text" class="search-box" placeholder="🔍 Cari pengumuman..." id="searchInput">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">Semua</button>
                <button class="filter-tab" data-filter="akademik">Akademik</button>
                <button class="filter-tab" data-filter="kegiatan">Kegiatan</button>
                <button class="filter-tab" data-filter="administrasi">Administrasi</button>
                <button class="filter-tab" data-filter="penting">Penting</button>
            </div>
        </div>

        <div class="announcements-container" id="announcementsContainer">
            <!-- Loading skeleton -->
            <div class="loading-card" id="loadingCard">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-items">
                <a href="dashboard.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M10,20v-6h4v6h5v-8h3L12,3L2,12h3v8z" />
                    </svg>
                    <div class="nav-label">Beranda</div>
                </a>
                <a href="attendance.html" class="nav-item" onclick="setActiveNav(this)">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path
                            d="M9,10H7V12H9V10M13,10H11V12H13V10M17,10H15V12H17V10M19,3H18V1H16V3H8V1H6V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V8H19V19Z" />
                    </svg>
                    <div class="nav-label">Absen</div>
                </a>
                <div class="nav-item active">
                    <div class="notification-dot"></div>
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path
                            d="M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22A1,1 0 0,1 23,15V16A1,1 0 0,1 22,17H21V18A2,2 0 0,1 19,20H5A2,2 0 0,1 3,18V17H2A1,1 0 0,1 1,16V15A1,1 0 0,1 2,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2M7.5,13A2.5,2.5 0 0,0 5,15.5A2.5,2.5 0 0,0 7.5,18A2.5,2.5 0 0,0 10,15.5A2.5,2.5 0 0,0 7.5,13M16.5,13A2.5,2.5 0 0,0 14,15.5A2.5,2.5 0 0,0 16.5,18A2.5,2.5 0 0,0 19,15.5A2.5,2.5 0 0,0 16.5,13Z" />
                    </svg>
                    <div class="nav-label">Pengumuman</div>
                </div>
                <a href="account.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path
                            d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M12,13A1.5,1.5 0 0,1 10.5,11.5A1.5,1.5 0 0,1 12,10A1.5,1.5 0 0,1 13.5,11.5A1.5,1.5 0 0,1 12,13M12,7.5C9.5,7.5 7.5,9.5 7.5,12C7.5,14.5 9.5,16.5 12,16.5C14.5,16.5 16.5,14.5 16.5,12C16.5,9.5 14.5,7.5 12,7.5Z" />
                    </svg>
                    <div class="nav-label">Akun</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Sample announcement data
        const announcements = [
            {
                id: 1,
                title: "Libur Hari Kemerdekaan RI ke-80",
                category: "penting",
                categoryName: "Penting",
                priority: "high",
                summary: "Sekolah diliburkan pada tanggal 17 Agustus 2025 dalam rangka memperingati Hari Kemerdekaan Republik Indonesia yang ke-80.",
                content: "Kepada seluruh siswa, guru, dan staff sekolah, diberitahukan bahwa sekolah akan diliburkan pada hari Sabtu, 17 Agustus 2025 dalam rangka memperingati Hari Kemerdekaan Republik Indonesia yang ke-80. Kegiatan belajar mengajar akan kembali normal pada hari Senin, 18 Agustus 2025.",
                author: "Kepala Sekolah",
                date: "2025-08-15",
                time: "08:00",
                tags: ["libur", "kemerdekaan", "nasional"],
                isNew: true,
                icon: "flag"
            },
            {
                id: 2,
                title: "Pendaftaran Ekstrakurikuler Tahun Ajaran 2025/2026",
                category: "kegiatan",
                categoryName: "Kegiatan",
                priority: "normal",
                summary: "Pendaftaran ekstrakurikuler untuk tahun ajaran baru telah dibuka. Siswa dapat mendaftar mulai tanggal 20 Agustus hingga 25 Agustus 2025.",
                content: "Ekstrakurikuler yang tersedia: Pramuka, Basket, Futsal, English Club, Rohis, Seni Tari, Karate, dan Robotik. Pendaftaran dapat dilakukan di ruang BK atau melalui aplikasi.",
                author: "Waka Kesiswaan",
                date: "2025-08-14",
                time: "14:30",
                tags: ["ekstrakurikuler", "pendaftaran", "siswa"],
                isNew: true,
                icon: "star"
            },
            {
                id: 3,
                title: "Ujian Tengah Semester Ganjil 2025/2026",
                category: "akademik",
                categoryName: "Akademik",
                priority: "high",
                summary: "Ujian Tengah Semester akan dilaksanakan pada minggu ke-3 September 2025. Siswa diharapkan mempersiapkan diri dengan baik.",
                content: "Jadwal UTS akan diumumkan seminggu sebelum pelaksanaan. Materi ujian sesuai dengan silabus yang telah diajarkan dari awal semester.",
                author: "Waka Kurikulum",
                date: "2025-08-13",
                time: "10:15",
                tags: ["ujian", "UTS", "akademik"],
                isNew: false,
                icon: "book"
            },
            {
                id: 4,
                title: "Perubahan Jadwal Pembayaran SPP",
                category: "administrasi",
                categoryName: "Administrasi",
                priority: "normal",
                summary: "Pembayaran SPP bulan September dapat dilakukan mulai tanggal 25 Agustus 2025 dengan sistem pembayaran digital yang baru.",
                content: "Sekolah telah menerapkan sistem pembayaran digital untuk memudahkan orang tua dalam pembayaran SPP. Informasi lebih lanjut akan diberikan melalui surat edaran.",
                author: "Bagian Keuangan",
                date: "2025-08-12",
                time: "16:45",
                tags: ["SPP", "pembayaran", "digital"],
                isNew: false,
                icon: "credit-card"
            },
            {
                id: 5,
                title: "Workshop Pembelajaran Digital untuk Guru",
                category: "akademik",
                categoryName: "Akademik",
                priority: "info",
                summary: "Workshop peningkatan kompetensi guru dalam menggunakan teknologi pembelajaran digital akan dilaksanakan setiap hari Jumat.",
                content: "Workshop ini bertujuan untuk meningkatkan kualitas pembelajaran dengan memanfaatkan teknologi digital. Materi meliputi penggunaan LMS, pembuatan konten interaktif, dan evaluasi online.",
                author: "Tim IT",
                date: "2025-08-11",
                time: "09:20",
                tags: ["workshop", "digital", "guru"],
                isNew: false,
                icon: "laptop"
            }
        ];

        let filteredAnnouncements = [...announcements];
        let currentFilter = 'all';

        // Initialize page
        window.addEventListener('load', function () {
            checkAuthentication();
            loadAnnouncements();
            setupEventListeners();
        });

        function checkAuthentication() {
            if (localStorage.getItem('isLoggedIn') !== 'true') {
                alert('Anda harus login terlebih dahulu!');
                window.location.href = 'index.html';
                return;
            }
        }

        function goBack() {
            window.history.back();
        }

        function setupEventListeners() {
            // Filter tabs
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', function () {
                    // Update active tab
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    // Filter announcements
                    currentFilter = this.dataset.filter;
                    filterAnnouncements();
                });
            });

            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function () {
                const searchTerm = this.value.toLowerCase();
                filteredAnnouncements = announcements.filter(announcement =>
                    announcement.title.toLowerCase().includes(searchTerm) ||
                    announcement.summary.toLowerCase().includes(searchTerm) ||
                    announcement.tags.some(tag => tag.toLowerCase().includes(searchTerm))
                );

                if (currentFilter !== 'all') {
                    filteredAnnouncements = filteredAnnouncements.filter(announcement =>
                        announcement.category === currentFilter
                    );
                }

                renderAnnouncements();
                updateAnnouncementCount();
            });
        }

        function filterAnnouncements() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            filteredAnnouncements = announcements.filter(announcement => {
                const matchesFilter = currentFilter === 'all' || announcement.category === currentFilter;
                const matchesSearch = searchTerm === '' ||
                    announcement.title.toLowerCase().includes(searchTerm) ||
                    announcement.summary.toLowerCase().includes(searchTerm) ||
                    announcement.tags.some(tag => tag.toLowerCase().includes(searchTerm));

                return matchesFilter && matchesSearch;
            });

            renderAnnouncements();
            updateAnnouncementCount();
        }

        function loadAnnouncements() {
            // Hide loading card
            setTimeout(() => {
                const loadingCard = document.getElementById('loadingCard');
                if (loadingCard) {
                    loadingCard.style.display = 'none';
                }
                renderAnnouncements();
                updateAnnouncementCount();
            }, 1500);
        }

        function renderAnnouncements() {
            const container = document.getElementById('announcementsContainer');
            const loadingCard = document.getElementById('loadingCard');

            // Clear existing content except loading card
            container.innerHTML = '';
            if (loadingCard && loadingCard.style.display !== 'none') {
                container.appendChild(loadingCard);
            }

            if (filteredAnnouncements.length === 0) {
                container.innerHTML += `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22A1,1 0 0,1 23,15V16A1,1 0 0,1 22,17H21V18A2,2 0 0,1 19,20H5A2,2 0 0,1 3,18V17H2A1,1 0 0,1 1,16V15A1,1 0 0,1 2,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2Z"/>
                            </svg>
                        </div>
                        <h3>Tidak ada pengumuman</h3>
                        <p>Pengumuman untuk kategori ini tidak tersedia saat ini.</p>
                    </div>
                `;
                return;
            }

            filteredAnnouncements.forEach(announcement => {
                const announcementHTML = createAnnouncementCard(announcement);
                container.innerHTML += announcementHTML;
            });

            // Add click event to announcement cards
            document.querySelectorAll('.announcement-card').forEach(card => {
                card.addEventListener('click', function () {
                    const id = parseInt(this.dataset.id);
                    showAnnouncementDetail(id);
                });
            });
        }

        function createAnnouncementCard(announcement) {
            const categoryIcons = {
                akademik: `<path d="M12,3L1,9L12,15L21,10.09V17H23V9M5,13.18V17.18L12,21L19,17.18V13.18L12,17L5,13.18Z"/>`,
                kegiatan: `<path d="M12,2A2,2 0 0,1 14,4C14,4.74 13.6,5.39 13,5.73V7H14A7,7 0 0,1 21,14H22A1,1 0 0,1 23,15V16A1,1 0 0,1 22,17H21V18A2,2 0 0,1 19,20H5A2,2 0 0,1 3,18V17H2A1,1 0 0,1 1,16V15A1,1 0 0,1 2,14H3A7,7 0 0,1 10,7H11V5.73C10.4,5.39 10,4.74 10,4A2,2 0 0,1 12,2M7.5,13A2.5,2.5 0 0,0 5,15.5A2.5,2.5 0 0,0 7.5,18A2.5,2.5 0 0,0 10,15.5A2.5,2.5 0 0,0 7.5,13M16.5,13A2.5,2.5 0 0,0 14,15.5A2.5,2.5 0 0,0 16.5,18A2.5,2.5 0 0,0 19,15.5A2.5,2.5 0 0,0 16.5,13Z"/>`,
                administrasi: `<path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>`,
                penting: `<path d="M13,14H11V10H13M13,18H11V16H13M1,21H23L12,2L1,21Z"/>`
            };

            const formattedDate = formatDate(announcement.date, announcement.time);
            const newBadge = announcement.isNew ? '<div class="new-badge">BARU</div>' : '';

            return `
                <div class="announcement-card" data-id="${announcement.id}">
                    ${newBadge}
                    <div class="announcement-header">
                        <div class="announcement-priority priority-${announcement.priority}">${getPriorityText(announcement.priority)}</div>
                        <div class="announcement-category">
                            <svg class="category-icon" viewBox="0 0 24 24">
                                ${categoryIcons[announcement.category] || categoryIcons.penting}
                            </svg>
                            ${announcement.categoryName}
                        </div>
                        <h3 class="announcement-title">${announcement.title}</h3>
                        <div class="announcement-meta">
                            <div class="meta-item">
                                <svg class="meta-icon" viewBox="0 0 24 24">
                                    <path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/>
                                </svg>
                                ${formattedDate}
                            </div>
                            <div class="meta-item">
                                <svg class="meta-icon" viewBox="0 0 24 24">
                                    <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/>
                                </svg>
                                ${announcement.author}
                            </div>
                        </div>
                    </div>
                    <div class="announcement-content">
                        <p class="announcement-summary">${announcement.summary}</p>
                        <div class="announcement-tags">
                            ${announcement.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                        </div>
                        <a href="#" class="read-more">
                            Baca selengkapnya
                            <svg class="read-more-icon" viewBox="0 0 24 24">
                                <path d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z"/>
                            </svg>
                        </a>
                    </div>
                </div>
            `;
        }

        function formatDate(dateString, time) {
            const date = new Date(dateString);
            const options = {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            };
            const formattedDate = date.toLocaleDateString('id-ID', options);
            return `${formattedDate}, ${time}`;
        }

        function getPriorityText(priority) {
            const priorityTexts = {
                high: 'Penting',
                normal: 'Normal',
                info: 'Info'
            };
            return priorityTexts[priority] || 'Normal';
        }

        function updateAnnouncementCount() {
            const count = filteredAnnouncements.length;
            const newCount = filteredAnnouncements.filter(a => a.isNew).length;
            let countText = `${count} pengumuman`;

            if (newCount > 0) {
                countText += ` • ${newCount} baru`;
            }

            if (currentFilter !== 'all') {
                const filterNames = {
                    akademik: 'Akademik',
                    kegiatan: 'Kegiatan',
                    administrasi: 'Administrasi',
                    penting: 'Penting'
                };
                countText += ` (${filterNames[currentFilter]})`;
            }

            document.getElementById('announcementCount').textContent = countText;
        }

        function showAnnouncementDetail(id) {
            const announcement = announcements.find(a => a.id === id);
            if (!announcement) return;

            // Create modal for detailed view
            const modal = document.createElement('div');
            modal.className = 'announcement-modal';
            modal.innerHTML = `
                <div class="modal-overlay" onclick="closeModal()"></div>
                <div class="modal-detail">
                    <div class="modal-header">
                        <button class="modal-close" onclick="closeModal()">
                            <svg viewBox="0 0 24 24">
                                <path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/>
                            </svg>
                        </button>
                        <div class="modal-priority priority-${announcement.priority}">${getPriorityText(announcement.priority)}</div>
                    </div>
                    <div class="modal-content">
                        <div class="modal-category">
                            ${announcement.categoryName}
                        </div>
                        <h1 class="modal-title">${announcement.title}</h1>
                        <div class="modal-meta">
                            <div class="meta-item">
                                <svg class="meta-icon" viewBox="0 0 24 24">
                                    <path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/>
                                </svg>
                                ${formatDate(announcement.date, announcement.time)}
                            </div>
                            <div class="meta-item">
                                <svg class="meta-icon" viewBox="0 0 24 24">
                                    <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/>
                                </svg>
                                ${announcement.author}
                            </div>
                        </div>
                        <div class="modal-text">
                            <p>${announcement.content}</p>
                        </div>
                        <div class="modal-tags">
                            ${announcement.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;

            // Add modal styles
            if (!document.getElementById('modal-styles')) {
                const modalStyles = document.createElement('style');
                modalStyles.id = 'modal-styles';
                modalStyles.textContent = `
                    .announcement-modal {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        z-index: 1000;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        padding: 20px;
                    }

                    .modal-overlay {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: rgba(0, 0, 0, 0.6);
                        backdrop-filter: blur(5px);
                    }

                    .modal-detail {
                        background: white;
                        border-radius: 20px;
                        max-width: 500px;
                        width: 100%;
                        max-height: 80vh;
                        overflow-y: auto;
                        position: relative;
                        z-index: 1001;
                        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
                    }

                    .modal-header {
                        padding: 20px 20px 10px;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        border-bottom: 1px solid #f0f0f0;
                    }

                    .modal-close {
                        background: #f5f5f5;
                        border: none;
                        border-radius: 50%;
                        width: 40px;
                        height: 40px;
                        cursor: pointer;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        transition: all 0.2s;
                    }

                    .modal-close:hover {
                        background: #e0e0e0;
                        transform: scale(1.1);
                    }

                    .modal-close svg {
                        width: 20px;
                        height: 20px;
                        fill: #666;
                    }

                    .modal-content {
                        padding: 20px;
                    }

                    .modal-category {
                        background: #e3f2fd;
                        color: #1976d2;
                        padding: 6px 12px;
                        border-radius: 20px;
                        font-size: 12px;
                        font-weight: 600;
                        display: inline-block;
                        margin-bottom: 15px;
                    }

                    .modal-title {
                        font-size: 24px;
                        font-weight: 600;
                        margin-bottom: 15px;
                        line-height: 1.4;
                        color: #333;
                    }

                    .modal-meta {
                        display: flex;
                        gap: 20px;
                        margin-bottom: 20px;
                        flex-wrap: wrap;
                    }

                    .modal-text {
                        font-size: 16px;
                        line-height: 1.6;
                        color: #555;
                        margin-bottom: 20px;
                    }

                    .modal-tags {
                        display: flex;
                        gap: 8px;
                        flex-wrap: wrap;
                    }

                    @media (max-width: 480px) {
                        .modal-detail {
                            margin: 10px;
                            max-height: 90vh;
                        }
                        
                        .modal-title {
                            font-size: 20px;
                        }
                        
                        .modal-meta {
                            flex-direction: column;
                            gap: 10px;
                        }
                    }
                `;
                document.head.appendChild(modalStyles);
            }

            document.body.appendChild(modal);

            // Mark as read (remove new badge)
            if (announcement.isNew) {
                announcement.isNew = false;
                renderAnnouncements();
                updateAnnouncementCount();
            }
        }

        function closeModal() {
            const modal = document.querySelector('.announcement-modal');
            if (modal) {
                modal.remove();
            }
        }

        function navigateToAbsen() {
            window.location.href = 'attendance.html';
        }

        // Add smooth animations
        function animateCards() {
            const cards = document.querySelectorAll('.announcement-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';

                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        }

        // Call animation after rendering
        const originalRenderAnnouncements = renderAnnouncements;
        renderAnnouncements = function () {
            originalRenderAnnouncements.call(this);
            setTimeout(animateCards, 50);
        };

        // Handle keyboard events
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Refresh announcements periodically (simulated)
        setInterval(() => {
            // In a real app, this would fetch new data from server
            console.log('Checking for new announcements...');
        }, 30000);

        // Add pull-to-refresh functionality
        let startY = 0;
        let currentY = 0;
        let pullDistance = 0;
        const maxPullDistance = 100;

        document.addEventListener('touchstart', function (e) {
            startY = e.touches[0].clientY;
        });

        document.addEventListener('touchmove', function (e) {
            if (window.scrollY === 0) {
                currentY = e.touches[0].clientY;
                pullDistance = Math.max(0, currentY - startY);

                if (pullDistance > 0 && pullDistance < maxPullDistance) {
                    const header = document.querySelector('.header');
                    if (header) {
                        header.style.transform = `translateY(${pullDistance * 0.5}px)`;
                        header.style.opacity = 1 - (pullDistance / maxPullDistance) * 0.3;
                    }
                }
            }
        });

        document.addEventListener('touchend', function (e) {
            if (pullDistance > 50) {
                // Trigger refresh
                const loadingCard = document.getElementById('loadingCard');
                if (loadingCard) {
                    loadingCard.style.display = 'block';
                }

                setTimeout(() => {
                    if (loadingCard) {
                        loadingCard.style.display = 'none';
                    }
                    // In a real app, this would fetch fresh data
                    console.log('Refreshed announcements');
                }, 1000);
            }

            // Reset header position
            const header = document.querySelector('.header');
            if (header) {
                header.style.transform = '';
                header.style.opacity = '';
                header.style.transition = 'all 0.3s ease';

                setTimeout(() => {
                    header.style.transition = '';
                }, 300);
            }

            pullDistance = 0;
        });
    </script>
</body>

</html>
